[package]
name = "sprid"
version = "0.9.25"
description = "A terminal emulator written in Almide"

[dependencies]
snaidhm = { git = "https://github.com/almide-graphics/snaidhm.git" }

[native-deps]
libc = "0.2"
png = "0.17"

# Dialect epoch 15 (#4093): a git dependency outside github.com/almide is fetched only
# from an owner the root manifest trusts.
[trust]
owners = ["github.com/almide-graphics"]

# Dialect epoch 15 (#4093): a dependency that brings native code is built only when
# the root manifest grants it by name.
[permissions]
native = ["snaidhm"]
