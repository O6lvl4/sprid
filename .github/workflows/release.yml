# Release builds: Linux (x86_64, arm64) and macOS (arm64), attached to a
# draft release for the pushed tag. Built with the Almide release in
# ALMIDE_REF, which has the fix sprid needs (almide#3049): a tag, so a build
# is the same whenever it runs. Linux builds run on
# Ubuntu 22.04, so the binary needs glibc 2.35 or later.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach to (it must exist)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  ALMIDE_REF: v0.66.0-rc3

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, arch: x86_64 }
          - { os: ubuntu-22.04-arm, arch: aarch64 }
          - { os: macos-14, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev libwayland-dev

      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Almide cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/almide/target/release/almide
          key: almide-${{ matrix.os }}-${{ env.ALMIDE_REF }}

      - name: Build Almide
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$ALMIDE_REF" https://github.com/almide/almide.git ~/almide
          cd ~/almide && cargo build --release

      - name: Version
        run: |
          toml=$(sed -n 's/^version = "\(.*\)"/\1/p' almide.toml | head -1)
          reported=$(sed -n 's/^let VERSION = "\(.*\)"/\1/p' src/vt/core.almd)
          if [ "v$toml" != "$TAG" ] || [ "$reported" != "$toml" ]; then
            echo "tag $TAG, almide.toml $toml, vt/core.almd $reported: run scripts/bump-version.sh" >&2
            exit 1
          fi

      - name: Test
        # Every test file. A file the wasm leg can't run (render.almd's tests
        # pull in the GPU host) passes on its native re-run.
        env:
          ALMIDE_TEST_LAX_WASM: "1"
        run: ~/almide/target/release/almide test

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' almide.toml | head -1)
          name="sprid-$version-linux-${{ matrix.arch }}"
          ~/almide/target/release/almide build --release src/main.almd -o sprid
          mkdir -p "dist/$name"
          cp sprid scripts/linux/sprid.desktop scripts/linux/install.sh LICENSE README.md "dist/$name/"
          cp assets/icon.png "dist/$name/sprid.png"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ALMIDE=~/almide/target/release/almide scripts/make-app.sh --zip

      - uses: actions/upload-artifact@v4
        with:
          name: sprid-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber *
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "sprid ${TAG#v}" --notes "Release notes to come." *
          fi
